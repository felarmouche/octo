spring.application.name=octo
# --- Google GenAI (Gemini Developer API) ---
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Standardmodell + Parameter
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.max-output-tokens=1024
spring.ai.google.genai.chat.thinking-level=MINIMAL

# Upload-Größe für Bilder
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Eigene Ausweichkette (Reihenfolge = Priorität) ---
gemini.fallback-models[0]=gemini-3.6-flash
gemini.fallback-models[1]=gemini-3.5-flash-lite
gemini.fallback-models[2]=gemini-3.8-flash
# Harter Timeout pro Gemini-Request, danach wird das nächste Modell probiert
gemini.request-timeout=60s


search-runner.delay.in.milliseconds=1000


