spring.application.name=octo

# --- PostgreSQL; Flyway applies the schema (db/migration) on startup ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/octo}
spring.datasource.username=${DB_USER:octo}
spring.datasource.password=${DB_PASSWORD:octo}
# --- Google GenAI (Gemini Developer API) ---
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Standardmodell + Parameter
spring.ai.google.genai.chat.model=gemini-3.6-flash
# Thinking-Tokens zählen bei Gemini zum Output-Limit -> Puffer, damit das JSON nicht abgeschnitten wird
spring.ai.google.genai.chat.max-output-tokens=2048
# Thinking-Level NICHT global setzen: es wird bei jedem Request mitgeschickt und nicht jedes Modell
# unterstützt jedes Level (gemini-3.8-flash lehnt MINIMAL mit 400 ab). Stattdessen pro Modell unten.

# Upload-Größe für Bilder
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Eigene Ausweichkette (Reihenfolge = Priorität, jeder Aufruf beginnt oben) ---
gemini.models[0].name=gemini-3.6-flash
gemini.models[0].thinking-level=MINIMAL
gemini.models[1].name=gemini-3.5-flash-lite
gemini.models[1].thinking-level=MINIMAL
gemini.models[2].name=gemini-3.8-flash
gemini.models[2].thinking-level=LOW
# Überlastete Modelle (429/503/Timeout) so lange überspringen
gemini.cooldown=60s
# Harter Timeout pro Gemini-Request, danach wird das nächste Modell probiert
gemini.request-timeout=60s


# Searches built in code on the new run (application.search.InCodeSearches)
octo.in-code-searches.interval=PT5M
# Rebuy catalogs are cached per Reference Product this long; the last good one is used when Rebuy is unreachable
octo.rebuy.catalog-ttl=PT6H


