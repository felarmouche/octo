# Octo, its PostgreSQL database and the frontend: `docker compose up --build`.
# The frontend is built from ../octo_frontend (clone both repos side by side) and served on ${OCTO_PORT:-80}.
# GEMINI_API_KEY and API_PASSWORD are taken from the shell or a local .env file (never committed).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: octo
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-octo}
    # Published for running Octo locally (IDE / bootRun) against it: `docker compose up -d postgres`
    ports:
      - "127.0.0.1:5432:5432" # localhost only, never reachable from outside
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo -d octo"]
      interval: 5s
      timeout: 5s
      retries: 10

  octo:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/octo
      DB_USER: octo
      DB_PASSWORD: ${DB_PASSWORD:-octo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_USER: ${API_USER:-octo}
      API_PASSWORD: ${API_PASSWORD:?set API_PASSWORD for the API user}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ../octo_frontend
    depends_on:
      - octo
    ports:
      - "${OCTO_PORT:-80}:80" # the app, and under /api the backend, on one origin
    restart: unless-stopped

volumes:
  postgres-data:
